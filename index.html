<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ICS Display</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Clock -->
    <div id="datetime">
        <div id="date"></div>
        <div id="clock"></div>
    </div>

    <!-- Video -->
    <div class="video-container">
        <video id="player" autoplay playsinline></video>
    </div>

    <!-- Countdown -->
    <div id="countdown"></div>

    <!-- Running Text -->
    <div class="ticker">
        <div class="ticker-text">
            -- Welcome to Indonesian Creative School — Inspiring Young Minds, Creating Global Impact -- |
            ICS Events | 14 August 2026 – Independence Day Celebration |
            17 August 2026 – Indonesian Independence Day
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
