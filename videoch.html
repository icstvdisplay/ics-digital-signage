
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ICS Fullscreen Video Display</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  /* FULLSCREEN BACKGROUND */
  .screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;

    background-image: url("images/ch.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* VIDEO RASIO 16:9 */
  .video-container {
    position: relative;
    height: 100%;
    aspect-ratio: 16 / 9;
    flex-shrink: 0;
    overflow: hidden;
    background: #000;
  }

  .video-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .video-layer.active {
    opacity: 1;
    z-index: 2;
  }

  .video-layer iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>

<body>

<div class="screen">

  <div class="video-container">
    <div id="layer0" class="video-layer active">
      <div id="player0"></div>
    </div>

    <div id="layer1" class="video-layer">
      <div id="player1"></div>
    </div>
  </div>

</div>

<script>
  const VIDEO_ID = "WmzRciQZbTw";

  let players = [];
  let activeIndex = 0;
  let switching = false;
  let duration = 0;

  const PRELOAD_SECONDS = 2;
  const CROSSFADE_SECONDS = 0.35;

  // Load YouTube IFrame API
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    for (let i = 0; i < 2; i++) {
      players[i] = new YT.Player("player" + i, {
        width: "100%",
        height: "100%",
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          iv_load_policy: 3
        },
        events: {
          onReady: (event) => onPlayerReady(event, i),
          onStateChange: (event) => onStateChange(event, i),
          onError: (event) => {
            console.error("YouTube error:", event.data);
          }
        }
      });
    }
  }

  let readyCount = 0;

  function onPlayerReady(event, index) {
    event.target.mute();
    readyCount++;

    if (readyCount === 2) {
      players[0].playVideo();
      players[1].cueVideoById(VIDEO_ID);
      monitorPlayback();
    }
  }

  function onStateChange(event, index) {
    if (index !== activeIndex) return;

    if (event.data === YT.PlayerState.PLAYING) {
      duration = event.target.getDuration();
    }

    if (event.data === YT.PlayerState.ENDED && !switching) {
      switchVideo();
    }
  }

  function monitorPlayback() {
    setInterval(() => {
      if (switching) return;

      const player = players[activeIndex];

      if (!player ||
          typeof player.getCurrentTime !== "function") {
        return;
      }

      const current = player.getCurrentTime();
      const total = player.getDuration();

      if (total > 0 &&
          current >= total - PRELOAD_SECONDS) {
        switchVideo();
      }

    }, 200);
  }

  function switchVideo() {
    if (switching) return;
    switching = true;

    const nextIndex = 1 - activeIndex;
    const currentPlayer = players[activeIndex];
    const nextPlayer = players[nextIndex];

    nextPlayer.seekTo(0, true);
    nextPlayer.playVideo();

    // Wait until the next video is playing
    let attempts = 0;

    const waitForPlayback = setInterval(() => {
      attempts++;

      if (nextPlayer.getPlayerState() ===
          YT.PlayerState.PLAYING) {

        clearInterval(waitForPlayback);

        document
          .getElementById("layer" + nextIndex)
          .classList.add("active");

        document
          .getElementById("layer" + activeIndex)
          .classList.remove("active");

        const previousIndex = activeIndex;
        activeIndex = nextIndex;

        setTimeout(() => {
          currentPlayer.pauseVideo();
          currentPlayer.seekTo(0, true);

          switching = false;
        }, CROSSFADE_SECONDS * 1000);

      } else if (attempts > 50) {
        clearInterval(waitForPlayback);
        switching = false;
      }
    }, 100);
  }
</script>

</body>
</html>
