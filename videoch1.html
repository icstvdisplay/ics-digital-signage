
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ICS Videotron Display</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* LAYAR VIDEOTRON 2432 x 768 */
    .screen {
      position: absolute;
      width: 2432px;
      height: 768px;

      top: 50%;
      left: 50%;

      transform-origin: center center;

      /* BACKGROUND */
      background-image: url("images/monev.png");
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /* VIDEO YOUTUBE TENGAH */
    .video-container {
      position: relative;

      width: 1365.333px;
      height: 768px;

      flex-shrink: 0;
      overflow: hidden;
      background: #000;
    }

    .video-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* HOME BUTTON */
    .nav-button {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 100;
      padding: 8px 15px;
      background: rgba(0, 0, 0, 0.4);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      text-decoration: none;
      transition: 0.3s;
    }

    .nav-button:hover {
      background: rgba(0, 0, 0, 0.9);
    }

  </style>
</head>

<body>

  <div class="screen">

    <!-- VIDEO YOUTUBE -->
    <div class="video-container">
<iframe
    id="ytplayer"
    src="https://www.youtube.com/embed/WuQ1bwYWkho?autoplay=1&loop=0&controls=1&rel=0&playsinline=1&vq=hd1080"
    title="YouTube video player"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
</iframe>


    </div>

  </div>

  <!-- HOME BUTTON -->
  <a href="https://ics-digital-signage.pages.dev/videoch.html"
     class="nav-button">
    ← Home
  </a>

  <script>
    /* FULL SCREEN SCALING */
    function resizeScreen() {

      const screen = document.querySelector(".screen");

      const scaleX = window.innerWidth / 2432;
      const scaleY = window.innerHeight / 768;

      screen.style.transform =
        `translate(-50%, -50%) scale(${scaleX}, ${scaleY})`;
    }

    window.addEventListener("resize", resizeScreen);
    resizeScreen();
  </script>

</body>
</html>
