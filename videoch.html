<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUN UNEP Display</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        img {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* Navigation Button */
        .nav-button {
            position: fixed;
            bottom: 15px;
            left: 15px;
            z-index: 100;
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-decoration: none;
            transition: 0.3s;
        }

        .nav-button:hover {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>

    <img src="images/ics2.png" alt="MUN UNEP">

    <a href="https://ics-digital-signage.pages.dev/videoch1.html" class="nav-button">
        ▶ Video
    </a>

</body>
</html>
